# -- Project Identity ----------------------------------------------------------
# projectKey is the unique ID in SonarCloud - never change this after first scan
# Format: <org-key>_<project-name> OR just a short slug - must match sonar.projectKey
sonar.projectKey=ecs-project
sonar.projectName=ECS Project (DevOps Toolbox)
sonar.projectVersion=1.0

# -- SonarCloud ----------------------------------------------------------------
# Organization key from: https://sonarcloud.io/account/organizations
sonar.organization=tanyaroy1708
sonar.host.url=https://sonarcloud.io

# -- Sources -------------------------------------------------------------------
sonar.sources=.
sonar.tests=tests/

# Exclude non-source artifacts from analysis
sonar.exclusions=tests/**,**/__pycache__/**,**/*.pyc,static/**,templates/**,.pytest_cache/**

# -- Language ------------------------------------------------------------------
sonar.language=py
sonar.python.version=3.11

# -- Coverage & Test Reports ---------------------------------------------------
# These files are generated by pytest --cov and --junitxml in the pipeline
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# -- SCM -----------------------------------------------------------------------
sonar.scm.provider=git
