<svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Inter, Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="cicdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1030"/>
      <stop offset="100%" style="stop-color:#200d35"/>
    </linearGradient>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1e12"/>
      <stop offset="100%" style="stop-color:#0c1a10"/>
    </linearGradient>
    <linearGradient id="vpcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#091220"/>
    </linearGradient>
    <linearGradient id="monGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071a10"/>
      <stop offset="100%" style="stop-color:#051510"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2040"/>
      <stop offset="100%" style="stop-color:#0c1c38"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0e35"/>
      <stop offset="100%" style="stop-color:#160b2d"/>
    </linearGradient>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff9500"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#39d353"/>
    </marker>
    <marker id="arrowWhite" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#e6edf3" letter-spacing="0.5">ECS Fargate Deployment Architecture</text>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#8b949e">AWS ECS Fargate · Jenkins CI/CD · Terraform IaC · Trivy Security · Grafana Monitoring</text>
  <line x1="80" y1="64" x2="1020" y2="64" stroke="#30363d" stroke-width="1"/>

  <!-- CI/CD ZONE -->
  <rect x="20" y="74" width="1060" height="200" rx="10" fill="url(#cicdGrad)" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="36" y="94" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="1.5">CI / CD  PIPELINE</text>

  <!-- GitHub Card -->
  <rect x="40" y="104" width="130" height="88" rx="8" fill="url(#cardPurple)" stroke="#6e40c9" stroke-width="1.5"/>
  <circle cx="105" cy="130" r="18" fill="#24292f" stroke="#6e40c9" stroke-width="1.5"/>
  <text x="105" y="136" text-anchor="middle" font-size="18" fill="#e6edf3">G</text>
  <text x="105" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">GitHub</text>
  <text x="105" y="170" text-anchor="middle" font-size="9" fill="#8b949e">Repository</text>
  <text x="105" y="182" text-anchor="middle" font-size="8" fill="#6e40c9">Webhook Trigger</text>

  <!-- Arrow GitHub to Jenkins -->
  <line x1="172" y1="148" x2="218" y2="148" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowWhite)"/>
  <text x="195" y="144" text-anchor="middle" font-size="8" fill="#a78bfa">push</text>

  <!-- Jenkins Card -->
  <rect x="220" y="104" width="155" height="88" rx="8" fill="url(#cardPurple)" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="297" cy="130" r="18" fill="#d97706" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="297" y="136" text-anchor="middle" font-size="16" fill="#1c1c1c">J</text>
  <text x="297" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">Jenkins CI/CD</text>
  <text x="297" y="170" text-anchor="middle" font-size="9" fill="#8b949e">EC2  t2/t3.micro</text>
  <text x="297" y="182" text-anchor="middle" font-size="8" fill="#f59e0b">Docker · Trivy · AWS CLI</text>

  <!-- Arrow Jenkins to Pipeline -->
  <line x1="377" y1="148" x2="414" y2="148" stroke="#d97706" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Pipeline Stages Box -->
  <rect x="416" y="100" width="640" height="96" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="736" y="117" text-anchor="middle" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="1">PIPELINE STAGES</text>

  <!-- Stage Checkout -->
  <rect x="428" y="124" width="82" height="58" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="469" y="148" text-anchor="middle" font-size="14" fill="#8b949e">SCM</text>
  <text x="469" y="163" text-anchor="middle" font-size="9" font-weight="600" fill="#8b949e">Checkout</text>
  <text x="469" y="175" text-anchor="middle" font-size="8" fill="#484f58">Clone repo</text>

  <line x1="512" y1="153" x2="524" y2="153" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Stage Trivy FS -->
  <rect x="526" y="124" width="82" height="58" rx="6" fill="#1a0a00" stroke="#d97706" stroke-width="1.2"/>
  <text x="567" y="148" text-anchor="middle" font-size="14" fill="#f59e0b">FS</text>
  <text x="567" y="163" text-anchor="middle" font-size="9" font-weight="600" fill="#f59e0b">Trivy FS</text>
  <text x="567" y="175" text-anchor="middle" font-size="8" fill="#d97706">Filesystem Scan</text>

  <line x1="610" y1="153" x2="622" y2="153" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Stage Docker Build -->
  <rect x="624" y="124" width="82" height="58" rx="6" fill="#001828" stroke="#00d4ff" stroke-width="1.2"/>
  <text x="665" y="148" text-anchor="middle" font-size="14" fill="#00d4ff">D</text>
  <text x="665" y="163" text-anchor="middle" font-size="9" font-weight="600" fill="#00d4ff">Docker</text>
  <text x="665" y="175" text-anchor="middle" font-size="8" fill="#00a8cc">Build + Tag</text>

  <line x1="708" y1="153" x2="720" y2="153" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Stage Trivy Image -->
  <rect x="722" y="124" width="82" height="58" rx="6" fill="#1a0a00" stroke="#d97706" stroke-width="1.2"/>
  <text x="763" y="148" text-anchor="middle" font-size="14" fill="#f59e0b">IMG</text>
  <text x="763" y="163" text-anchor="middle" font-size="9" font-weight="600" fill="#f59e0b">Trivy Image</text>
  <text x="763" y="175" text-anchor="middle" font-size="8" fill="#d97706">Image Scan</text>

  <line x1="806" y1="153" x2="818" y2="153" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Stage Push ECR -->
  <rect x="820" y="124" width="82" height="58" rx="6" fill="#001a08" stroke="#39d353" stroke-width="1.2"/>
  <text x="861" y="148" text-anchor="middle" font-size="14" fill="#39d353">ECR</text>
  <text x="861" y="163" text-anchor="middle" font-size="9" font-weight="600" fill="#39d353">Push ECR</text>
  <text x="861" y="175" text-anchor="middle" font-size="8" fill="#238636">:latest + :tag</text>

  <line x1="904" y1="153" x2="916" y2="153" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrowWhite)"/>

  <!-- Stage Deploy ECS -->
  <rect x="918" y="124" width="82" height="58" rx="6" fill="#001a28" stroke="#2563eb" stroke-width="1.2"/>
  <text x="959" y="148" text-anchor="middle" font-size="14" fill="#60a5fa">ECS</text>
  <text x="959" y="163" text-anchor="middle" font-size="9" font-weight="600" fill="#60a5fa">Deploy ECS</text>
  <text x="959" y="175" text-anchor="middle" font-size="8" fill="#3b82f6">Force Redeploy</text>

  <!-- AWS ZONE -->
  <rect x="20" y="288" width="1060" height="420" rx="10" fill="url(#awsGrad)" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="36" y="308" font-size="11" font-weight="700" fill="#fb923c" letter-spacing="1.5">AWS CLOUD</text>

  <!-- Left sidebar -->
  <rect x="36" y="318" width="155" height="372" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="113" y="337" text-anchor="middle" font-size="10" font-weight="600" fill="#8b949e" letter-spacing="0.8">SUPPORT SERVICES</text>

  <!-- ECR Card -->
  <rect x="46" y="346" width="135" height="72" rx="6" fill="url(#cardBlue)" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="113" y="375" text-anchor="middle" font-size="16" fill="#60a5fa">ECR</text>
  <text x="113" y="392" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">Elastic Container</text>
  <text x="113" y="405" text-anchor="middle" font-size="9" fill="#60a5fa">Registry  ·  Docker Images</text>

  <!-- IAM Card -->
  <rect x="46" y="428" width="135" height="72" rx="6" fill="url(#cardPurple)" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="113" y="456" text-anchor="middle" font-size="16" fill="#a78bfa">IAM</text>
  <text x="113" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">Instance Profile</text>
  <text x="113" y="487" text-anchor="middle" font-size="9" fill="#a78bfa">No Static Keys</text>

  <!-- S3 + DynamoDB Card -->
  <rect x="46" y="510" width="135" height="88" rx="6" fill="#0d1117" stroke="#059669" stroke-width="1.2"/>
  <text x="113" y="538" text-anchor="middle" font-size="16" fill="#34d399">S3 + DDB</text>
  <text x="113" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">Remote State</text>
  <text x="113" y="570" text-anchor="middle" font-size="9" fill="#34d399">Terraform Backend</text>
  <text x="113" y="584" text-anchor="middle" font-size="8" fill="#6ee7b7">State Locking</text>

  <!-- Terraform Card -->
  <rect x="46" y="608" width="135" height="72" rx="6" fill="url(#cardPurple)" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="113" y="636" text-anchor="middle" font-size="14" fill="#a78bfa">TF</text>
  <text x="113" y="654" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">Terraform IaC</text>
  <text x="113" y="668" text-anchor="middle" font-size="8" fill="#a78bfa">VPC · ALB · ECS · ECR · SG</text>

  <!-- VPC Box -->
  <rect x="210" y="318" width="856" height="382" rx="10" fill="url(#vpcGrad)" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="230" y="340" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.8">Custom VPC  10.0.0.0/16  ·  2 Availability Zones</text>

  <!-- ALB -->
  <rect x="370" y="352" width="520" height="72" rx="8" fill="#0e2040" stroke="#0ea5e9" stroke-width="2" filter="url(#glowCyan)"/>
  <text x="630" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">Application Load Balancer</text>
  <text x="630" y="402" text-anchor="middle" font-size="10" fill="#38bdf8">Port 80 Inbound  ·  Forwards to Fargate :8000  ·  Public Security Group</text>
  <text x="630" y="416" text-anchor="middle" font-size="9" fill="#60a5fa">ALB DNS  -&gt;  Internet Facing</text>

  <!-- AZ-1 -->
  <rect x="224" y="446" width="390" height="240" rx="8" fill="#061020" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="350" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#93c5fd" letter-spacing="1">AVAILABILITY ZONE  us-east-1a</text>

  <!-- Public Subnet AZ1 -->
  <rect x="238" y="476" width="362" height="196" rx="6" fill="#0a1830" stroke="#1e40af" stroke-width="1"/>
  <text x="419" y="494" text-anchor="middle" font-size="9" fill="#60a5fa" font-weight="600">PUBLIC SUBNET</text>

  <!-- Fargate Task AZ1 -->
  <rect x="268" y="504" width="302" height="152" rx="8" fill="url(#cardBlue)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="419" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">ECS Fargate Task</text>
  <text x="419" y="548" text-anchor="middle" font-size="10" fill="#60a5fa">FastAPI Application  ·  Port 8000</text>
  <text x="419" y="564" text-anchor="middle" font-size="9" fill="#8b949e">Private Security Group</text>
  <text x="419" y="580" text-anchor="middle" font-size="8" fill="#38bdf8">Stateless  ·  Non-root container user</text>
  <text x="419" y="596" text-anchor="middle" font-size="8" fill="#6ee7b7">ecs-project-cluster  /  ecs-project-service</text>
  <text x="419" y="612" text-anchor="middle" font-size="8" fill="#a78bfa">Multi-stage Dockerfile  ·  Python</text>
  <text x="419" y="628" text-anchor="middle" font-size="8" fill="#60a5fa">routers/  ·  services/  ·  templates/</text>
  <text x="419" y="645" text-anchor="middle" font-size="8" fill="#8b949e">GET /health  ·  DevOps Toolbox Routes</text>

  <!-- AZ-2 -->
  <rect x="630" y="446" width="422" height="240" rx="8" fill="#061020" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="841" y="466" text-anchor="middle" font-size="10" font-weight="700" fill="#93c5fd" letter-spacing="1">AVAILABILITY ZONE  us-east-1b</text>

  <!-- Public Subnet AZ2 -->
  <rect x="644" y="476" width="394" height="196" rx="6" fill="#0a1830" stroke="#1e40af" stroke-width="1"/>
  <text x="841" y="494" text-anchor="middle" font-size="9" fill="#60a5fa" font-weight="600">PUBLIC SUBNET</text>

  <!-- Fargate Task AZ2 -->
  <rect x="674" y="504" width="334" height="152" rx="8" fill="url(#cardBlue)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="841" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#e6edf3">ECS Fargate Task</text>
  <text x="841" y="548" text-anchor="middle" font-size="10" fill="#60a5fa">FastAPI Application  ·  Port 8000</text>
  <text x="841" y="564" text-anchor="middle" font-size="9" fill="#8b949e">Private Security Group</text>
  <text x="841" y="580" text-anchor="middle" font-size="8" fill="#38bdf8">Stateless  ·  Non-root container user</text>
  <text x="841" y="596" text-anchor="middle" font-size="8" fill="#6ee7b7">ecs-project-cluster  /  ecs-project-service</text>
  <text x="841" y="612" text-anchor="middle" font-size="8" fill="#a78bfa">Multi-stage Dockerfile  ·  Python</text>
  <text x="841" y="628" text-anchor="middle" font-size="8" fill="#60a5fa">routers/  ·  services/  ·  templates/</text>
  <text x="841" y="645" text-anchor="middle" font-size="8" fill="#8b949e">GET /health  ·  DevOps Toolbox Routes</text>

  <!-- ALB to AZ1 Fargate -->
  <line x1="560" y1="424" x2="419" y2="504" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowCyan)"/>
  <!-- ALB to AZ2 Fargate -->
  <line x1="700" y1="424" x2="841" y2="504" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowCyan)"/>

  <!-- ECR to Jenkins (image push back) -->
  <line x1="181" y1="382" x2="297" y2="192" stroke="#39d353" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>

  <!-- MONITORING ZONE -->
  <rect x="20" y="722" width="1060" height="82" rx="10" fill="url(#monGrad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="36" y="742" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1.5">MONITORING  &amp;  ALERTING</text>

  <!-- CloudWatch -->
  <rect x="150" y="750" width="210" height="44" rx="6" fill="#071a10" stroke="#059669" stroke-width="1.2"/>
  <text x="255" y="771" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">CloudWatch</text>
  <text x="255" y="786" text-anchor="middle" font-size="9" fill="#34d399">CPU Alarm &gt; 80%  ·  2x 1-min periods</text>

  <line x1="362" y1="772" x2="420" y2="772" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Grafana -->
  <rect x="422" y="750" width="210" height="44" rx="6" fill="#071a10" stroke="#f97316" stroke-width="1.2"/>
  <text x="527" y="771" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">Grafana  :3000</text>
  <text x="527" y="786" text-anchor="middle" font-size="9" fill="#fb923c">ECS/ContainerInsights  ·  EC2 IAM Auth</text>

  <!-- CW Alarm badge -->
  <rect x="690" y="750" width="230" height="44" rx="6" fill="#071a10" stroke="#dc2626" stroke-width="1.2"/>
  <text x="805" y="771" text-anchor="middle" font-size="11" font-weight="700" fill="#e6edf3">CW Alarm</text>
  <text x="805" y="786" text-anchor="middle" font-size="9" fill="#f87171">ecs-project-cpu-high  ·  CPUUtilization  AWS/ECS</text>

  <!-- ECS to CloudWatch arrow -->
  <line x1="419" y1="710" x2="255" y2="752" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>

  <!-- Footer -->
  <line x1="80" y1="810" x2="1020" y2="810" stroke="#21262d" stroke-width="1"/>
  <text x="550" y="820" text-anchor="middle" font-size="9" fill="#484f58">github.com/TanyaRoy1708/ecs-deployment-devopstoolbox  ·  AWS ECS Fargate · Jenkins · Terraform · Trivy · Grafana</text>
</svg>
